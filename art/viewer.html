<!doctype html><meta charset="utf-8"><body style="margin:0;background:#9bb"><canvas id="c" width="900" height="500"></canvas>
<script src="../live/vendor/three.min.js"></script><script src="../live/kit.js"></script>
<script>
// art/viewer.html — dev viewer for the soldier GLB: ?clip=Run_Gun&t=0.2 ; window.__done when rendered. Not part of the build.
(async () => {
  const q = new URLSearchParams(location.search), clips = (q.get('clips') || 'Run_Gun').split(','), T = THREE;
  const cv = document.getElementById('c'), r = new T.WebGLRenderer({ canvas: cv, antialias: true }); r.setSize(900, 500, false); r.outputColorSpace = T.SRGBColorSpace;
  const sc = new T.Scene(); sc.background = new T.Color(0x9bb8c8); sc.add(new T.HemisphereLight(0xffffff, 0x667788, 1.6)); const d = new T.DirectionalLight(0xffffff, 2.2); d.position.set(3, 5, 4); sc.add(d);
  const buf = await (await fetch(q.get('src') || '../live/models/soldier.glb')).arrayBuffer(), L = new T.GLTFLoader(); L.setMeshoptDecoder(T.MeshoptDecoder); const g = await L.parseAsync(buf, '');
  if (q.get('onlyAK')) g.scene.traverse((o) => { if (o.isMesh && /^(Sniper|SMG|RocketLauncher|Revolver|Revolver_Small|Pistol|GrenadeLauncher|ShortCannon|Shotgun|Sniper_2|Shovel|Knife_2|Knife_1)$/.test(o.name)) o.visible = false; });
  const cam = new T.PerspectiveCamera(30, 900 / 500, 0.1, 50); const info = {};
  clips.forEach((c, i) => { const rig = KIT.rig(g); rig.play(c, +(q.get('t') || 0.2)); rig.root.position.x = (i - (clips.length - 1) / 2) * 2.2; sc.add(rig.root); rig.root.updateMatrixWorld(true);
    const b = new T.Box3().setFromObject(rig.root); info[c] = { h: +(b.max.y - b.min.y).toFixed(2), w: +(b.max.x - b.min.x).toFixed(2), d: +(b.max.z - b.min.z).toFixed(2), minY: +b.min.y.toFixed(2) };
    rig.root.traverse((o) => { if (o.isBone && /^(Index1\.?R|Head)$/.test(o.name)) { const p = new T.Vector3().setFromMatrixPosition(o.matrixWorld); info[c][o.name] = p.toArray().map((v) => +v.toFixed(2)); } }); });
  // test gun: a box with the ORIGINAL AK's bbox (AK units) at the original attach transform under bone Index1.R
  const AK = { t: [0.0001, 0.0015, -0.0005], q: [-0.5469, -0.3212, 0.4225, 0.6475], s: 0.4179 }, A = new T.Matrix4().compose(new T.Vector3(...AK.t), new T.Quaternion(...AK.q), new T.Vector3(AK.s, AK.s, AK.s));
  const guns = []; if (!q.get('nobox')) sc.traverse((o) => { if (o.isBone && /^Index1\.?R$/.test(o.name)) { const m = new T.Mesh(new T.BoxGeometry(0.034, 0.004, 0.018).translate(0.008, 0, 0.001), new T.MeshBasicMaterial({ color: 0xff2200 })); m.matrixAutoUpdate = false; sc.add(m); guns.push([o, m]); } });
  sc.updateMatrixWorld(true); for (const [b, m] of guns) { m.matrix.multiplyMatrices(b.matrixWorld, A); m.matrixWorld.copy(m.matrix); }
  if (q.get('face')) { const pt = +(q.get('pitch') || 0.84), D = +(q.get('D') || 2.6); let head; sc.traverse((o) => { if (o.isBone && o.name === 'Head') head = o; }); const hp = new T.Vector3().setFromMatrixPosition(head.matrixWorld);
    const ey = +q.get('ey'), ez = +q.get('ez'), M = new T.MeshBasicMaterial({ color: 0xff00ff }), mk = (x, y, z, w, h, d, c) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), new T.MeshBasicMaterial({ color: c })); m.position.set(hp.x + x, hp.y + y, hp.z + z); sc.add(m); };
    mk(-0.09, ey, ez, 0.1, 0.07, 0.04, 0xffffff); mk(0.09, ey, ez, 0.1, 0.07, 0.04, 0xffffff); mk(0, ey + 0.2, ez, 0.04, 0.04, 0.04, 0x00ffff); mk(0, 0.45, 0.0, 0.02, 0.9, 0.02, 0x00ff00);
    cam.position.set(0, hp.y + Math.sin(pt) * D, Math.cos(pt) * D); cam.lookAt(0, hp.y, 0); r.render(sc, cam); window.__info = { head: hp.toArray().map((v) => +v.toFixed(2)) }; window.__png = cv.toDataURL('image/png'); window.__done = true; return; }
  cam.position.set(0, 1.3, 6.5 + clips.length * 1.2); cam.lookAt(0, 0.9, 0); r.render(sc, cam);
  window.__info = info; window.__png = cv.toDataURL('image/png'); window.__done = true;
})();
</script>
